services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ordexa_db
    ports:
      - "3307:3306"   # <-- Yahan 3306 ki jagah 3307 kar do
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: ordexa_app
    ports:
      - "9090:8080"
    depends_on:
      - db

volumes:
  mysql_data: